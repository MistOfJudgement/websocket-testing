<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Durable Object WebRTC Tester</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h2 {
            margin-top: 0;
            color: #38bdf8;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input,
        button {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 14px;
        }

        input {
            background: #1e293b;
            color: #fff;
            flex: 1;
            min-width: 180px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .status {
            padding: 8px 12px;
            background: #1e293b;
            border-radius: 6px;
            font-size: 13px;
            font-family: monospace;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #020617;
            padding: 10px;
            border-radius: 8px;
        }

        .video-container {
            position: relative;
            background: #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            background: #1e293b;
            border-radius: 8px;
            padding: 10px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            padding-right: 4px;
        }

        .msg {
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            max-width: 85%;
            word-break: break-word;
        }

        .msg.me {
            background: #0369a1;
            align-self: flex-end;
        }

        .msg.peer {
            background: #334155;
            align-self: flex-start;
        }

        .msg.system {
            background: transparent;
            color: #94a3b8;
            font-style: italic;
            font-size: 11px;
            align-self: center;
        }
    </style>
</head>

<body>

    <h2>WebRTC Durable Object Test Client</h2>

    <div class="controls">
        <input type="text" id="roomId" value="test-room" placeholder="Room ID" />
        <input type="text" id="peerId" placeholder="Peer ID (auto-generated)" />
        <button id="btnConnect" onclick="connect()">Connect & Join</button>
        <button id="btnMedia" onclick="toggleMedia()" disabled>Enable Camera/Mic</button>
    </div>

    <div class="status" id="statusLog">Status: Disconnected</div>

    <div class="main-grid" style="margin-top: 15px;">
        <div class="video-grid">
            <div class="video-container">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="label">Local Stream</div>
            </div>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="label">Remote Stream</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chatBox">
                <div class="msg system">Join room to start messaging</div>
            </div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="chatInput" placeholder="Type message..." disabled
                    onkeypress="if(event.key==='Enter') sendMessage()" />
                <button id="btnSend" onclick="sendMessage()" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        // Auto-generate peer ID
        document.getElementById('peerId').value = 'peer_' + Math.random().toString(36).substring(2, 7);

        let ws = null;
        let peerConnection = null;
        let dataChannel = null;
        let localStream = null;
        let myPeerId = '';
        let targetPeerId = null;

        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] // Public STUN server
        };

        function log(msg) {
            document.getElementById('statusLog').innerText = 'Status: ' + msg;
            console.log(msg)
        }

        function addChatMessage(text, type = 'system') {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function connect() {
            const roomId = document.getElementById('roomId').value.trim();
            myPeerId = document.getElementById('peerId').value.trim();

            if (!roomId || !myPeerId) return alert('Room ID and Peer ID are required.');

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${location.host}/room/${roomId}?peerId=${myPeerId}`;

            log(`Connecting to ${wsUrl}...`);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                log(`Connected to room [${roomId}] as ${myPeerId}`);
                document.getElementById('btnConnect').disabled = true;
                document.getElementById('btnMedia').disabled = false;
                addChatMessage(`Joined room: ${roomId}`);
            };

            ws.onmessage = async (event) => {
                console.log(event.data)
                const msg = JSON.parse(event.data);
                handleSignalingMessage(msg);
            };

            ws.onclose = () => {
                log('WebSocket Disconnected');
                document.getElementById('btnConnect').disabled = false;
                closePeerConnection();
            };
        }

        // Replace handleSignalingMessage in HTML_CLIENT

        async function handleSignalingMessage(msg) {
            console.log('[WebRTC] Received signaling message:', msg);

            switch (msg.type) {
                case 'peer-joined':
                    log(`Peer joined: ${msg.peerId}`);
                    addChatMessage(`${msg.peerId} joined the room.`);
                    targetPeerId = msg.peerId;

                    // Automatically initiate connection & data channel when a new peer arrives
                    createPeerConnection();
                    createDataChannel();

                    // Create and send SDP Offer
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);

                    console.log('[WebRTC] Sending offer to', targetPeerId);
                    ws.send(JSON.stringify({ type: 'offer', offer, targetPeerId }));
                    break;

                case 'offer':
                    log(`Received offer from ${msg.from}`);
                    targetPeerId = msg.from;

                    createPeerConnection();

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);

                    console.log('[WebRTC] Sending answer to', targetPeerId);
                    ws.send(JSON.stringify({ type: 'answer', answer, targetPeerId }));
                    break;

                case 'answer':
                    log(`Received answer from ${msg.from}`);
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.answer));
                    break;

                case 'ice-candidate':
                    if (msg.candidate && peerConnection) {
                        console.log('[WebRTC] Adding ICE Candidate from', msg.from);
                        await peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate));
                    }
                    break;

                case 'peer-left':
                    log(`Peer left: ${msg.peerId}`);
                    addChatMessage(`${msg.peerId} disconnected.`);
                    closePeerConnection();
                    break;
            }
        }

        function createPeerConnection() {
            if (peerConnection) return;


            const temp = {
                "username": "v1:1791086131:api:-:fcb551812c528fecbb3670b7",
                "credential": "6UQ9tldiVxk2sgsO9ev15+tMCRt1+7Q+Rjvqj5SeK20=",
                "urls": [
                    "turn:aws-global-1.c.rstream.io:3478?transport=udp",
                    "turn:aws-global-1.c.rstream.io:3478?transport=tcp",
                    "turns:aws-global-1.c.rstream.io:5349?transport=udp",
                    "turns:aws-global-1.c.rstream.io:5349?transport=tcp"
                ],
            }
            // Standard public STUN server for local/NAT hole punching
            peerConnection = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' },
                    temp
                ]
            });

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && ws.readyState === WebSocket.OPEN) {
                    console.log("ws send ice candidate")
                    ws.send(JSON.stringify({
                        type: 'ice-candidate',
                        candidate: event.candidate,
                        targetPeerId
                    }));
                }
            };

            // Peer B listens for Peer A's DataChannel
            peerConnection.ondatachannel = (event) => {
                console.log('[WebRTC] Remote data channel received');
                dataChannel = event.channel;
                setupDataChannelEvents();
            };
        }

        function createDataChannel() {
            if (!peerConnection) return;
            console.log('[WebRTC] Creating local DataChannel');
            dataChannel = peerConnection.createDataChannel('chat');
            setupDataChannelEvents();
        }

        function setupDataChannelEvents() {
            if (!dataChannel) return;

            dataChannel.onopen = () => {
                console.log('[WebRTC] DataChannel state: OPEN');
                document.getElementById('chatInput').disabled = false;
                document.getElementById('btnSend').disabled = false;
                addChatMessage('Direct P2P Data Channel connected!', 'system');
            };

            dataChannel.onmessage = (e) => {
                console.log('[WebRTC] DataChannel message received:', e.data);
                addChatMessage(e.data, 'peer');
            };

            dataChannel.onerror = (err) => console.error('[WebRTC] DataChannel error:', err);

            dataChannel.onclose = () => {
                console.log('[WebRTC] DataChannel state: CLOSED');
                document.getElementById('chatInput').disabled = true;
                document.getElementById('btnSend').disabled = true;
            };
        }
        async function toggleMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('btnMedia').disabled = true;

                if (peerConnection) {
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                    // Renegotiate offer if connection is active
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    ws.send(JSON.stringify({ type: 'offer', offer, targetPeerId }));
                }
            } catch (err) {
                alert('Could not access camera/mic: ' + err.message);
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const val = input.value.trim();
            if (val && dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(val);
                addChatMessage(val, 'me');
                input.value = '';
            }
        }

        function closePeerConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('chatInput').disabled = true;
            document.getElementById('btnSend').disabled = true;
        }
    </script>
</body>

</html>
